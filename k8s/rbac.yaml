apiVersion: v1
kind: ServiceAccount
metadata: { name: jenkins-deployer, namespace: healthcare }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: app-deployer, namespace: healthcare }
rules:
- apiGroups: ["", "apps"]
  resources: ["deployments", "services", "pods"]
  verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: app-deployer-binding, namespace: healthcare }
subjects:
- kind: ServiceAccount
  name: jenkins-deployer
  namespace: healthcare
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io
