apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-app
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels: { app: healthcare-app }
  template:
    metadata:
      labels: { app: healthcare-app }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef: { name: db-secret, key: password }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 100m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-app
  namespace: healthcare
  labels: { app: healthcare-app }
spec:
  type: NodePort
  selector: { app: healthcare-app }
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30080
